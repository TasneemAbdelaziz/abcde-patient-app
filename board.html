<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.B.C.D.E — Task Board · لوحة المهام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0e7c86;--teal-d:#0a5a62;--ink:#14302f;--muted:#6b8786;--bg:#eef3f3;--card:#fff;--line:#e2eceb;
    --todo:#c2453d;--doing:#b67b12;--review:#3a6ea5;--done:#16895a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Outfit','Tajawal',system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(1200px 600px at 80% -10%,#e7f4f3 0%,var(--bg) 55%);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100vh;overflow:hidden}
  /* header */
  .top{padding:12px 18px 8px;flex:none}
  .top h1{font-family:'Fraunces',serif;font-weight:600;font-size:21px;margin:0;display:flex;align-items:center;gap:10px}
  .top h1 .badge{font-family:'Outfit';font-size:11px;font-weight:700;letter-spacing:.12em;background:var(--teal);color:#fff;padding:3px 9px;border-radius:999px}
  .top .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  /* toolbar */
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 18px;flex:none}
  .group{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .group .lbl{font-size:11px;color:var(--muted);font-weight:600;margin-inline-end:2px}
  .chip{font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:6px 11px;border-radius:999px;transition:.12s;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--teal);color:var(--teal)}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.person.on{background:var(--pc,#333);border-color:var(--pc,#333)}
  input.search,select.sel{font-family:inherit;font-size:12.5px;padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none}
  input.search:focus,select.sel:focus{border-color:var(--teal)}
  .spacer{flex:1}
  button.act{font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--teal);background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:10px}
  button.act:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
  /* progress strip */
  .stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:4px 18px 10px;flex:none}
  .pcard{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
  .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;flex:none}
  .pcard .pn{font-size:12px;font-weight:600;line-height:1}
  .pcard .pr{font-size:10.5px;color:var(--muted)}
  .pbar{width:64px;height:6px;border-radius:99px;background:#e9efef;overflow:hidden}
  .pbar > i{display:block;height:100%;background:var(--done)}
  .pcard .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .overall{margin-inline-start:auto;font-size:12.5px;font-weight:600;color:var(--teal);display:flex;align-items:center;gap:8px}
  .overall .pbar{width:120px;height:8px}
  /* board */
  .board{display:flex;gap:14px;padding:6px 18px 18px;overflow-x:auto;flex:1;align-items:flex-start}
  .col{flex:1 1 0;min-width:270px;max-width:1fr;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:16px;
    display:flex;flex-direction:column;max-height:100%}
  .col.drag{background:#e7f4f3;border-color:var(--teal);border-style:dashed}
  .colhead{display:flex;align-items:center;gap:8px;padding:11px 13px 8px;flex:none}
  .colhead .nm{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px}
  .colhead .k{width:10px;height:10px;border-radius:50%}
  .colhead .num{margin-inline-start:auto;font-size:11.5px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px;min-width:24px;text-align:center}
  .list{padding:4px 9px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;flex:1}
  /* card */
  .tc{flex:none;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 11px 9px;cursor:grab;position:relative;overflow:hidden;
    box-shadow:0 4px 14px -10px rgba(14,124,134,.5);transition:.1s}
  .tc:active{cursor:grabbing}
  .tc.ghost{opacity:.4}
  .tc.hl{box-shadow:0 0 0 2px var(--teal), 0 6px 16px -10px rgba(14,124,134,.6)}
  .tc::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--mc,#999)}
  .tc .r1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px;padding-inline-start:4px}
  .srs{font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;background:var(--mc,#777);border-radius:6px;padding:2px 6px;letter-spacing:.02em}
  .mtag{font-size:10px;font-weight:700;color:var(--mc,#777);border:1px solid currentColor;border-radius:6px;padding:1px 6px}
  .pr0,.pr1,.pr2{font-size:9.5px;font-weight:800;border-radius:5px;padding:2px 5px;letter-spacing:.04em}
  .pr0{background:#fdeceb;color:#c2453d}.pr1{background:#fdf3e0;color:#b67b12}.pr2{background:#eef2f8;color:#3a6ea5}
  .tc .ttl{font-size:13px;font-weight:600;line-height:1.25;padding-inline-start:4px}
  .tc .ar{font-size:11.5px;color:var(--muted);font-family:'Tajawal';padding-inline-start:4px;margin-top:1px}
  .tc .io{font-size:10.5px;color:#8aa0a0;padding-inline-start:4px;margin-top:5px;line-height:1.35;border-top:1px dashed var(--line);padding-top:5px}
  .tc .io b{color:var(--muted);font-weight:600}
  .tc .r2{display:flex;align-items:center;gap:6px;margin-top:8px;padding-inline-start:4px;flex-wrap:wrap}
  .surf{font-size:10px;color:var(--muted);background:#f2f6f6;border-radius:6px;padding:2px 7px;font-weight:600}
  .own{display:inline-flex;align-items:center;gap:4px;position:relative}
  .own .ic{font-size:11px;opacity:.7}
  .own select{font-family:inherit;font-size:10.5px;font-weight:700;border:none;border-radius:7px;padding:3px 4px;color:#fff;cursor:pointer;appearance:none;text-align:center}
  .own select.empty{background:#dfe7e7 !important;color:#90a3a3 !important}
  .hint{padding:0 18px 8px;color:var(--muted);font-size:11px;flex:none}
  @media (max-width:760px){.board{flex-direction:column;overflow-x:hidden;overflow-y:auto}.col{max-width:none;width:100%}}
  /* add / edit / custom / modal */
  button.act.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
  button.act.primary:hover{background:var(--teal-d)}
  .tc .editbtn{position:absolute;top:6px;inset-inline-end:7px;width:22px;height:22px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px;cursor:pointer;line-height:1;padding:0;opacity:0;transition:.12s;z-index:2}
  .tc:hover .editbtn{opacity:1}
  .tc .editbtn:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
  .tc.custom{border-color:#bfe0d4;box-shadow:0 4px 14px -10px rgba(22,137,90,.7)}
  .newtag{font-size:9px;font-weight:800;color:#16895a;background:#e7f6ee;border-radius:5px;padding:2px 5px}
  .modal-bg{position:fixed;inset:0;background:rgba(20,48,47,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:18px;padding:20px;width:min(460px,94vw);max-height:92vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
  .modal h3{font-family:'Fraunces',serif;font-weight:600;margin:0 0 10px;font-size:19px}
  .modal label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:9px 0 3px}
  .modal input,.modal select,.modal textarea{width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff;color:var(--ink);resize:vertical}
  .modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--teal)}
  .modal .row{display:flex;gap:8px}.modal .row>div{flex:1;min-width:0}
  .modal .btns{display:flex;gap:8px;margin-top:16px;align-items:center}
  .modal .btns button{padding:10px 14px;border-radius:10px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted)}
  .modal .btns .save{background:var(--teal);color:#fff;border-color:var(--teal);flex:1}
  .modal .btns .del{background:#fdeceb;color:#c2453d;border-color:#fdeceb}
</style>
</head>
<body>
  <div class="top">
    <h1><span class="badge">A.B.C.D.E</span> Task Board · لوحة المهام <span style="font-family:'Outfit';font-size:12px;font-weight:600;color:var(--muted)">— Alamein Model Hospital</span></h1>
    <div class="sub">كل feature من الـ mindmap = كارت · اسحب الكارت بين الأعمدة لتغيير الحالة · غيّر المسؤول (🎨 فرونت · ⚙️ باك) · التغييرات تتحفظ تلقائياً في المتصفح.</div>
  </div>

  <div class="bar">
    <div class="group"><span class="lbl">👤 الشخص</span><span id="peopleChips"></span></div>
    <div class="group"><span class="lbl">الأولوية</span>
      <span class="chip prio on" data-p="all">الكل</span>
      <span class="chip prio" data-p="P0">P0</span>
      <span class="chip prio" data-p="P1">P1</span>
      <span class="chip prio" data-p="P2">P2</span>
    </div>
    <select class="sel" id="moduleSel"></select>
    <input class="search" id="search" placeholder="🔎 بحث... (اسم/SRS)" style="width:160px">
    <div class="spacer"></div>
    <button class="act primary" id="addBtn">➕ مهمة جديدة</button>
    <button class="act" id="exportBtn">⬇ Export</button>
    <button class="act" id="resetBtn">↺ Reset</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="board" id="board"></div>
  <div class="hint" id="hint"></div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3 id="modalTitle">مهمة جديدة</h3>
      <div class="row">
        <div><label>SRS</label><input id="ed_srs" placeholder="—"></div>
        <div><label>Module</label><select id="ed_m"></select></div>
        <div><label>الحالة</label><select id="ed_st"></select></div>
      </div>
      <label>العنوان (English)</label><input id="ed_en" placeholder="Feature name">
      <label>العنوان (عربي)</label><input id="ed_ar" placeholder="اسم المهمة">
      <div class="row">
        <div><label>Surface</label><input id="ed_surface" placeholder="Mobile / Web / Backend"></div>
        <div><label>Role</label><input id="ed_role" placeholder="Patient / Doctor..."></div>
      </div>
      <div class="row">
        <div><label>🎨 Frontend</label><select id="ed_fe"></select></div>
        <div><label>⚙️ Backend</label><select id="ed_be"></select></div>
      </div>
      <label>In → Out (عقد الـ API)</label><textarea id="ed_io" rows="2" placeholder="inputs → outputs"></textarea>
      <div class="btns">
        <button class="del" id="ed_del" style="display:none">🗑 حذف</button>
        <button id="ed_cancel">إلغاء</button>
        <button class="save" id="ed_save">💾 حفظ</button>
      </div>
    </div>
  </div>

<script>
/* ============ TEAM ============ */
const TEAM={
  Mohamed:{role:'Backend',color:'#0e7c86'},

   t(srs, en, ar, module, surface, role, status, fe, be)  */

/* ============ STATE / PERSISTENCE ============ */
const KEY='abcde-board-v1', KEY_C='abcde-board-custom-v1';
let overrides=JSON.parse(localStorage.getItem(KEY)||'{}');
let custom=JSON.parse(localStorage.getItem(KEY_C)||'[]');
function save(){localStorage.setItem(KEY,JSON.stringify(overrides));}
function saveCustom(){localStorage.setItem(KEY_C,JSON.stringify(custom));}
function allTasks(){return TASKS.concat(custom);}
function isCustom(id){return custom.some(x=>x.id===id);}
function task(o){const ov=overrides[o.id]||{};return {...o,...ov};}
function set(id,patch){overrides[id]={...(overrides[id]||{}),...patch};save();render();}

/* ============ FILTERS ============ */
const F={person:'all',prio:'all',module:'all',q:''};

/* people chips */
const pc=document.getElementById('peopleChips');
function pchip(name,color){const c=document.createElement('span');c.className='chip person'+(F.person===name?' on':'');
  c.style.setProperty('--pc',color||'#0e7c86');
  c.innerHTML=(name==='all'?'الكل':`<span class="av" style="width:18px;height:18px;font-size:9px;background:${color}">${initials(name)}</span>${name}`);
  c.onclick=()=>{F.person=name;render();};return c;}
function buildPeople(){pc.innerHTML='';pc.appendChild(pchip('all'));
  Object.entries(TEAM).forEach(([n,o])=>pc.appendChild(pchip(n,o.color)));}

/* module select */
const msel=document.getElementById('moduleSel');
msel.innerHTML='<option value="all">📦 كل الـ Modules</option>'+Object.entries(MOD).map(([k,m])=>`<option value="${k}">${k} · ${m.name} (${m.p})</option>`).join('');
msel.onchange=()=>{F.module=msel.value;render();};
document.querySelectorAll('.chip.prio').forEach(c=>c.onclick=()=>{F.prio=c.dataset.p;document.querySelectorAll('.chip.prio').forEach(x=>x.classList.toggle('on',x===c));render();});
document.getElementById('search').oninput=e=>{F.q=e.target.value.trim().toLowerCase();render();};

function match(o){
  if(F.module!=='all'&&o.m!==F.module)return false;
  if(F.prio!=='all'&&MOD[o.m].p!==F.prio)return false;
  if(F.person!=='all'&&o.fe!==F.person&&o.be!==F.person)return false;
  if(F.q){const s=(o.srs+' '+o.en+' '+o.ar+' '+o.role+' '+o.m+' '+MOD[o.m].name).toLowerCase();if(!s.includes(F.q))return false;}
  return true;
}

/* ============ RENDER ============ */
const board=document.getElementById('board');
function ownSel(o,field){
  const val=o[field];const wrap=document.createElement('span');wrap.className='own';
  wrap.innerHTML=`<span class="ic">${field==='fe'?'🎨':'⚙️'}</span>`;
  const s=document.createElement('select');
  const opts=['—',...Object.keys(TEAM)];
  s.innerHTML=opts.map(n=>`<option value="${n}"${n===val?' selected':''}>${n}</option>`).join('');
  const col=val==='—'?'':TEAM[val]?.color;
  if(val==='—')s.classList.add('empty');else s.style.background=col;
  s.onchange=e=>{e.stopPropagation();set(o.id,{[field]:s.value});};
  s.onclick=e=>e.stopPropagation();
  wrap.appendChild(s);return wrap;}

function card(o){
  const m=MOD[o.m];const el=document.createElement('div');el.className='tc';el.draggable=true;el.style.setProperty('--mc',m.color);
  if(F.person!=='all'&&(o.fe===F.person||o.be===F.person))el.classList.add('hl');
  if(isCustom(o.id))el.classList.add('custom');
  const r1=document.createElement('div');r1.className='r1';
  r1.innerHTML=`<span class="srs">${o.srs}</span><span class="mtag">${o.m}</span><span class="pr${m.p[1]}">${m.p}</span>`+(isCustom(o.id)?'<span class="newtag">✦ جديد</span>':'');
  const ttl=document.createElement('div');ttl.className='ttl';ttl.textContent=o.en;
  const ar=document.createElement('div');ar.className='ar';ar.textContent=o.ar;
  const io=document.createElement('div');io.className='io';io.innerHTML=`<b>In→Out:</b> ${o.io||''}`;
  const r2=document.createElement('div');r2.className='r2';
  r2.innerHTML=`<span class="surf">${o.surface} · ${o.role}</span>`;
  r2.appendChild(ownSel(o,'fe'));r2.appendChild(ownSel(o,'be'));
  const edit=document.createElement('button');edit.className='editbtn';edit.textContent='✎';edit.title='تعديل';edit.draggable=false;
  edit.onclick=ev=>{ev.stopPropagation();openEditor(o.id);};
  el.append(r1,ttl,ar,io,r2,edit);
  el.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',o.id);el.classList.add('ghost');});
  el.addEventListener('dragend',()=>el.classList.remove('ghost'));
  return el;}

function render(){
  buildPeople();
  const items=allTasks().map(task).filter(match);
  board.innerHTML='';
  COLS.forEach(col=>{
    const c=document.createElement('div');c.className='col';c.dataset.k=col.k;
    const list=items.filter(o=>o.st===col.k);
    const head=document.createElement('div');head.className='colhead';
    head.innerHTML=`<span class="nm"><span class="k" style="background:${col.c}"></span>${col.nm}</span><span class="num">${list.length}</span>`;
    const ul=document.createElement('div');ul.className='list';
    list.forEach(o=>ul.appendChild(card(o)));
    c.append(head,ul);
    c.addEventListener('dragover',ev=>{ev.preventDefault();c.classList.add('drag');});
    c.addEventListener('dragleave',()=>c.classList.remove('drag'));
    c.addEventListener('drop',ev=>{ev.preventDefault();c.classList.remove('drag');
      const id=+ev.dataTransfer.getData('text/plain');if(id)set(id,{st:col.k});});
    board.appendChild(c);
  });
  renderStats();
  document.getElementById('hint').textContent=`عدد المهام المعروضة: ${items.length} من ${allTasks().length} · إجمالي ${Object.keys(MOD).length} موديول، ${Object.keys(TEAM).length} أعضاء · اسحب الكارت لتغيير الحالة · ✎ للتعديل · ➕ لإضافة مهمة.`;
}

function renderStats(){
  const all=allTasks().map(task);
  const stats=document.getElementById('stats');stats.innerHTML='';
  Object.entries(TEAM).forEach(([n,o])=>{
    const mine=all.filter(x=>x.fe===n||x.be===n);
    const done=mine.filter(x=>x.st==='done').length;
    const pct=mine.length?Math.round(done/mine.length*100):0;
    const d=document.createElement('div');d.className='pcard';
    d.innerHTML=`<span class="av" style="background:${o.color}">${initials(n)}</span>
      <span><span class="pn">${n}</span><br><span class="pr">${o.role}</span></span>
      <span class="pbar"><i style="width:${pct}%;background:${o.color}"></i></span>
      <span class="cnt">${done}/${mine.length}</span>`;
    d.style.cursor='pointer';d.onclick=()=>{F.person=(F.person===n?'all':n);render();};
    stats.appendChild(d);
  });
  const done=all.filter(x=>x.st==='done').length;
  const doing=all.filter(x=>x.st==='doing').length;
  const pct=Math.round(done/all.length*100);
  const ov=document.createElement('div');ov.className='overall';
  ov.innerHTML=`الإنجاز الكلي: ${done}/${all.length} (${pct}%) · شغّال ${doing}
    <span class="pbar"><i style="width:${pct}%"></i></span>`;
  stats.appendChild(ov);
}

/* ============ ACTIONS ============ */
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('استرجاع كل المهام لحالتها الأصلية؟ (هيمسح تعديلاتك المحفوظة)')){overrides={};save();render();}
};
document.getElementById('exportBtn').onclick=()=>{
  const rows=[['SRS','Module','Priority','Feature(EN)','Feature(AR)','Surface','Role','Status','Frontend','Backend']];
  allTasks().map(task).forEach(o=>rows.push([o.srs,o.m,MOD[o.m].p,o.en,o.ar,o.surface,o.role,o.st,o.fe,o.be]));
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='abcde-tasks.csv';a.click();
};

/* ============ EDITOR (add / edit task) ============ */
const mg=document.getElementById('modalBg');
function fillSel(id,arr,val){document.getElementById(id).innerHTML=arr.map(o=>`<option value="${o.v}"${o.v===val?' selected':''}>${o.t}</option>`).join('');}
let editingId=null;
const gv=id=>document.getElementById(id).value;
const sv=(id,v)=>document.getElementById(id).value=v;
function openEditor(id){
  editingId=id||null;
  const o=id?task(allTasks().find(x=>x.id===id)):{srs:'—',en:'',ar:'',m:'M1',surface:'Mobile',role:'',st:'todo',fe:'—',be:'—',io:''};
  fillSel('ed_m',Object.keys(MOD).map(k=>({v:k,t:`${k} · ${MOD[k].name}`})),o.m);
  fillSel('ed_st',COLS.map(c=>({v:c.k,t:c.nm})),o.st);
  fillSel('ed_fe',['—',...Object.keys(TEAM)].map(n=>({v:n,t:n})),o.fe);
  fillSel('ed_be',['—',...Object.keys(TEAM)].map(n=>({v:n,t:n})),o.be);
  sv('ed_srs',o.srs);sv('ed_en',o.en);sv('ed_ar',o.ar);sv('ed_surface',o.surface);sv('ed_role',o.role);sv('ed_io',o.io||'');
  document.getElementById('modalTitle').textContent=id?'تعديل المهمة':'➕ مهمة جديدة';
  document.getElementById('ed_del').style.display=(id&&isCustom(id))?'block':'none';
  mg.classList.add('show');
}
function closeEditor(){mg.classList.remove('show');editingId=null;}
document.getElementById('ed_cancel').onclick=closeEditor;
mg.onclick=e=>{if(e.target===mg)closeEditor();};
document.getElementById('addBtn').onclick=()=>openEditor(null);
document.getElementById('ed_save').onclick=()=>{
  const f={srs:gv('ed_srs')||'—',en:gv('ed_en')||'(بدون عنوان)',ar:gv('ed_ar'),m:gv('ed_m'),
    surface:gv('ed_surface')||'—',role:gv('ed_role')||'—',st:gv('ed_st'),fe:gv('ed_fe'),be:gv('ed_be'),io:gv('ed_io')};
  if(editingId){
    if(isCustom(editingId)){const i=custom.findIndex(x=>x.id===editingId);custom[i]={...custom[i],...f};saveCustom();}
    else{overrides[editingId]={...(overrides[editingId]||{}),...f};save();}
  }else{custom.push({id:Date.now(),...f});saveCustom();}
  closeEditor();render();
};
document.getElementById('ed_del').onclick=()=>{
  if(editingId&&isCustom(editingId)&&confirm('حذف المهمة دي نهائياً؟')){
    custom=custom.filter(x=>x.id!==editingId);saveCustom();delete overrides[editingId];save();closeEditor();render();}
};

render();
</script>
